version: "3.9"

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: thermoshelter-postgres
    environment:
      POSTGRES_DB: thermoshelter
      POSTGRES_USER: thermoshelter_user
      POSTGRES_PASSWORD: thermoshelter_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermoshelter_user -d thermoshelter"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (broker + result backend) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: thermoshelter-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI application ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thermoshelter-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://thermoshelter_user:thermoshelter_pass@postgres:5432/thermoshelter
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      USE_BACKGROUND_JOBS: "true"
      USE_MOCK_SIMULATION: "true"
      USE_MOCK_OPTIMIZATION: "true"
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
    working_dir: /app

  # ── Celery Worker ─────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thermoshelter-worker
    environment:
      DATABASE_URL: postgresql://thermoshelter_user:thermoshelter_pass@postgres:5432/thermoshelter
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      USE_MOCK_SIMULATION: "true"
      USE_MOCK_OPTIMIZATION: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - .:/app
    working_dir: /app

volumes:
  postgres_data:
