# railway.toml — ThermoShelter deployment configuration
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

# ── API Service (default) ─────────────────────────────────────────────────────
[deploy]
startCommand = "alembic upgrade head || (alembic stamp head && alembic upgrade head) && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
